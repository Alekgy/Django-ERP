{% extends 'errors/base_error.html' %}
{% block error_actions %}
<a href="{% url 'admin_panel' %}" class="btn-misen-dark">
    <i class="bi bi-grid-fill"></i> Ir al Panel Autorizado
</a>

<div class="divider-container">
    <div class="divider-line"></div>
    <span class="divider-pill">O</span>
</div>

<div class="d-flex flex-column gap-2">
    <button type="button" onclick="history.back()" class="btn-misen-outline">
        <i class="bi bi-arrow-left"></i> Volver a la pantalla anterior
    </button>
    <a href="{% url 'login' %}" class="btn btn-link text-decoration-none fw-bold small mt-1" style="color: var(--text-dark) !important;">
        Cambiar de cuenta / Iniciar sesión
    </a>
</div>
{% endblock %}
