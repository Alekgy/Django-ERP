{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="card shadow border-0 p-4" style="border-radius: 20px;">
        <h2 class="fw-bold mb-4">Nueva Transformación</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="row mb-4">
                <div class="col-md-8">
                    <label class="form-label fw-bold">Producto Resultante (Pulpa/Insumo)</label>
                    <select name="result_ingredient" class="form-select select2" required>
                        {% for i in productos_resultantes %}
                            <option value="{{ i.id }}">{{ i.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Cantidad Producida</label>
                    <input type="number" name="quantity_produced" step="0.01" class="form-control" placeholder="Ej: 1000" required>
                </div>
            </div>

            <hr>
            <h5 class="fw-bold mb-3">Materias Primas Usadas</h5>
            <div id="material-rows">
                <div class="row mb-2 material-row">
                    <div class="col-md-7">
                        <select name="material_id[]" class="form-select" required>
                            {% for i in materias_primas %}
                                <option value="{{ i.id }}">{{ i.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <input type="number" name="material_qty[]" step="0.01" class="form-control" placeholder="Cantidad" required>
                    </div>
                    <div class="col-md-1">
                        <button type="button" class="btn btn-outline-danger btn-remove">×</button>
                    </div>
                </div>
            </div>

            <button type="button" id="btn-add-material" class="btn btn-outline-dark btn-sm rounded-pill px-3 shadow-sm">
                <i class="bi bi-plus-circle me-1"></i>+ Añadir otra materia prima
            </button>

            <div class="mt-5 text-end">
                <a href="{% url 'home' %}" class="btn btn-light rounded-pill px-4">Cancelar</a>
                <button type="submit" class="btn btn-dark rounded-pill px-5 fw-bold">REGISTRAR TRANSFORMACIÓN</button>
            </div>
        </form>
    </div>
</div>

<script>
    // Script simple para añadir/quitar filas
    document.getElementById('btn-add-material').addEventListener('click', function() {
        const row = document.querySelector('.material-row').cloneNode(true);
        row.querySelector('input').value = '';
        document.getElementById('material-rows').appendChild(row);
    });

    document.addEventListener('click', function(e) {
        if (e.target.classList.contains('btn-remove')) {
            const rows = document.querySelectorAll('.material-row');
            if (rows.length > 1) e.target.closest('.row').remove();
        }
    });
</script>
{% endblock %}
