{% extends 'base.html' %}
{% block content %}
{% csrf_token %}

<div class="card bg-dark text-white shadow">
    <div class="card-header border-warning d-flex justify-content-between align-items-center">
        <h3 class="text-warning mb-0">Ingreso de Mercancía 📦</h3>
        <select id="branch-select" class="form-select bg-secondary text-white border-0 w-25">
            <option value="">Seleccionar Sede...</option>
            {% for sede in sedes %}
            <!-- El value ahora será el UUID string de la sede -->
            <option value="{{ sede.id }}">{{ sede.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="card-body">
        <div id="dynamic-rows-container">
            <!-- Aquí aparecerán las filas -->
        </div>
        
        <div class="mt-4 d-flex gap-2">
            <button class="btn btn-outline-warning" onclick="agregarFila()">
                + Agregar Ingrediente
            </button>
            <button class="btn btn-success" onclick="guardarTodo()">
                Guardar Todo el Ingreso
            </button>
        </div>
    </div>
</div>

<!-- Plantilla oculta para las filas (Template) -->
<template id="row-template">
    <div class="row g-2 mb-2 align-items-center ingredient-row">
        <div class="col-md-4">
            <select class="form-select bg-secondary text-white border-0 select-ingredient">
                <option value="">Seleccionar ingrediente...</option>
                {% for ing in todos_los_ingredientes %}
                <option value="{{ ing.id }}">
                    {{ ing.name }} ({% if ing.unit_measure %}{{ ing.unit_measure.abbreviation }}{% else %}und{% endif %})
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-3">
            <input type="number" step="0.01" class="form-control input-qty" placeholder="Cant. (ml, gr, und)">
        </div>
        <div class="col-md-3">
            <div class="input-group">
                <span class="input-group-text bg-secondary text-white border-0">$</span>
                <input type="number" step="0.01" class="form-control input-price" placeholder="Precio Total">
            </div>
        </div>
        <div class="col-md-2 text-end">
            <button class="btn btn-danger" onclick="this.parentElement.parentElement.remove()">×</button>
        </div>
    </div>
</template>

<script>
    // Esta función DEBE estar aquí arriba para que el botón la encuentre
    function agregarFila() {
        const container = document.getElementById('dynamic-rows-container');
        const template = document.getElementById('row-template');
        
        if (!template) {
            console.error("No se encontró el template 'row-template'");
            return;
        }

        const clone = template.content.cloneNode(true);
        container.appendChild(clone);
    }

    function guardarTodo() {
        const branchId = document.getElementById('branch-select').value;
        if (!branchId) return alert("Por favor, selecciona una sede primero.");

        const rows = document.querySelectorAll('.ingredient-row');
        const items = [];

        rows.forEach(row => {
            const id = row.querySelector('.select-ingredient').value;
            const cantidad = row.querySelector('.input-qty').value;
            const precio = row.querySelector('.input-price').value;

            if (id && cantidad && precio) {
                items.push({ 
                    id: id, 
                    cantidad: parseFloat(cantidad), 
                    precio_total: parseFloat(precio) 
                });
            }
        });

        if (items.length === 0) return alert("Completa al menos un ingrediente con cantidad y precio.");

        const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        fetch("{% url 'realizar_ingreso_masivo' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrftoken 
            },
            body: JSON.stringify({ 
                branch_id: branchId, 
                items: items 
            })
        })
        .then(response => response.json().then(data => ({ status: response.status, body: data })))
        .then(res => {
            if (res.status === 200) {
                alert("✅ " + res.body.message);
                location.reload(); 
            } else {
                alert("❌ Error: " + res.body.message);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Error crítico en la comunicación con el servidor.");
        });
    }
</script>
{% endblock %}
