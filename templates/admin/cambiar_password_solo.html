{% extends "base.html" %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card shadow-lg border-0 rounded-4" style="width: 100%; max-width: 450px;">
        <div class="card-header bg-warning text-dark text-center py-3 border-0 rounded-top-4">
            <h5 class="mb-0 fw-bold"><i class="bi bi-shield-lock-fill me-2"></i> Cambiar mi Contraseña</h5>
        </div>
        <div class="card-body p-4">
            <form method="POST" id="formPasswordSolo">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Contraseña Anterior</label>
                    <input type="password" name="old_password" class="form-control rounded-pill" required>
                </div>
                <hr class="my-4">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nueva Contraseña</label>
                    <input type="password" name="new_password" class="form-control rounded-pill" required minlength="4">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Confirmar Nueva Contraseña</label>
                    <input type="password" name="confirm_password" class="form-control rounded-pill" required minlength="4">
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-warning fw-bold rounded-pill">Actualizar Ahora</button>
                    <a href="{% url 'home' %}" class="btn btn-light rounded-pill">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    {% if messages %}
        {% for message in messages %}
            let icon = 'success';
            let title = '¡Éxito!';
            
            {% if 'old_pass_error' in message.tags %}
                icon = 'error';
                title = 'Error en Clave Anterior';
            {% elif 'new_pass_error' in message.tags %}
                icon = 'error';
                title = 'Error en Clave Nueva';
            {% elif message.tags == 'error' %}
                icon = 'error';
                title = 'Error';
            {% endif %}

            Swal.fire({
                icon: icon,
                title: title,
                text: "{{ message }}",
                confirmButtonColor: icon === 'error' ? '#d33' : '#ffc107',
                borderRadius: '15px'
            });
        {% endfor %}
    {% endif %}
});
</script>
{% endblock %}
